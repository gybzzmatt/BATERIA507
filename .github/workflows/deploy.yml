name: Deploy Baterias 507 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare deploy folder
        run: |
          cp -r baterias507-static-export deploy
          touch deploy/.nojekyll
          find deploy -name "*.html" -exec sed -i 's/lang="en"/lang="es"/g' {} +
          find deploy -name "*.html" -exec sed -i 's|https://sight-slide-show.lovable.app/|https://g2n3.org/|g' {} +
          find deploy -name "*.html" -exec sed -i 's|https://sight-slide-show.lovable.app|https://g2n3.org|g' {} +
          find deploy -name "*.html" -exec sed -i 's|sight-slide-show.lovable.app/__l5e/assets-v1/f88904f2-8d80-4c8d-b3c9-f02bbb3eec78/logo-white-v2.png|logo-white-v2.png|g' {} +
          find deploy -name "*.html" -exec sed -i 's|sight-slide-show.lovable.app/__l5e/assets-v1/b7e2aebc-c020-4194-befe-6440ad3d387b/logo-white.png|logo-white.png|g' {} +
          find deploy -name "*.html" -exec sed -i 's|sight-slide-show.lovable.app/__l5e/assets-v1/4feb986f-00e7-4d73-9dc9-734e1f389df3/logo-profile-circle.png|logo-profile-circle.png|g' {} +
          find deploy -name "*.html" -exec sed -i 's|tel:+5078305729|tel:+50764201550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|tel:+50761105730|tel:+50764201550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|830-5729|6420-1550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|6110-5730|6420-1550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|8305729|64201550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|61105730|64201550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|wa.me/5078305729|wa.me/50764201550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|wa.me/50761105730|wa.me/50764201550|g' {} +
          find deploy -name "*.html" -exec sed -i 's|hola@baterias507.com|ventas@baterias507.com|g' {} +
          find deploy -name "*.html" -exec sed -i 's|Vassworld, Malachar, Bunker|VASWORLD POWER|g' {} +
          find deploy -name "*.js" -exec sed -i 's|830-5729|6420-1550|g' {} +
          find deploy -name "*.js" -exec sed -i 's|6110-5730|6420-1550|g' {} +
          find deploy -name "*.js" -exec sed -i 's|8305729|64201550|g' {} +
          find deploy -name "*.js" -exec sed -i 's|61105730|64201550|g' {} +
          find deploy -name "*.js" -exec sed -i 's|hola@baterias507.com|ventas@baterias507.com|g' {} +
          sed -i 's|sight-slide-show.lovable.app|g2n3.org|g' deploy/robots.txt || true
          sed -i 's|sight-slide-show.lovable.app|g2n3.org|g' deploy/llms.txt || true
          echo "All fixes applied"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
